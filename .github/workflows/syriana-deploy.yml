# Added by Syriana (syriana.store) — builds this site on every push; Syriana publishes it to your Cloudflare.
# No key or secret lives here: this job only builds, and keeps the result for one day.
name: Syriana deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: syriana-deploy
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci || npm install
      - run: |
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: syriana-site
          path: dist
          retention-days: 1
          if-no-files-found: error
